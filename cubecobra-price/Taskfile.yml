# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  CUBE_ID: "d8b9e896-d66d-4cf8-9c59-f752d78d27ac"
  BINARY_PATH: './cubecobra-price-checker'
  DEFAULT_BULK_DATA_API_URL: "https://api.scryfall.com/bulk-data/default-cards"
  DEFAULT_BULK_DATA_PATH: DefaultCards.json
  DEFAULT_BULK_DATA_API_CONTENTS:
    sh: curl -s {{ .DEFAULT_BULK_DATA_API_URL }}
  DEFAULT_BULK_DATA_API_CONTENTS_PARSED:
    ref: 'fromJson .DEFAULT_BULK_DATA_API_CONTENTS'

tasks:
  build:
    aliases: [default]
    sources:
      - '*.go'
    generates:
      - "{{ .BINARY_PATH }}"
    cmd: go build -o "{{ .BINARY_PATH }}" ./...
  run:
    deps: [download-data, build]
    cmd: "{{ .BINARY_PATH }} {{ .CUBE_ID }}"
  download-data:
    status:
      - test -f {{ .DEFAULT_BULK_DATA_PATH }} && test ! $(find {{ .DEFAULT_BULK_DATA_PATH }} -mmin +720)
    cmd: curl -o {{ .DEFAULT_BULK_DATA_PATH }} {{ .DEFAULT_BULK_DATA_API_CONTENTS_PARSED.download_uri }}
  build-docker:
    deps: [download-data]
    cmd: docker build -t cubecobra-price-checker .
  run-docker:
    deps: [build-docker]
    cmd: docker run cubecobra-price-checker {{ .CUBE_ID }}
    
