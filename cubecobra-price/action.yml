name: CubeCobra Cube Price Calculator
description: Fetches a CubeCobra cube's mainboard and calculates the total paper cost using Scryfall price data.

inputs:
  cube_id:
    description: "CubeCobra cube ID"
    required: false
    default: "d8b9e896-d66d-4cf8-9c59-f752d78d27ac"

runs:
  using: composite
  steps:
    - name: Install Task
      uses: go-task/setup-task@v1

    - name: Run CubeCobra price checker
      run: task run-docker CUBE_ID=${CUBE_ID}
      shell: bash
      working-directory: ./cubecobra-price
      env:
        CUBE_ID: ${{ inputs.cube_id }}
