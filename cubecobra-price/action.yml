name: CubeCobra Cube Price Calculator
description: Fetches a CubeCobra cube's mainboard and calculates the total paper cost using Scryfall price data.

inputs:
  cubecobra_link:
    description: "CubeCobra cube link (e.g. https://cubecobra.com/cube/overview/my-cube) or bare cube ID"
    required: true

runs:
  using: docker
  image: Dockerfile
  args:
    - ${{ inputs.cubecobra_link }}
