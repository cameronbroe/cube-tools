name: CubeCobra Cube Price Calculator

on:
  workflow_dispatch:
    inputs:
      cube_id:
        description: "CubeCobra cube ID"
        required: true
        type: string

jobs:
  calculate-price:
    name: Calculate Total Cube Price
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate cube total cost
        uses: ./cubecobra-price
        with:
          cube_id: ${{ inputs.cube_id }}
