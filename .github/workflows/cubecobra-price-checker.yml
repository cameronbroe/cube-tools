name: CubeCobra Cube Price Calculator

on:
  schedule:
    # Run every 3 months
    - cron: '0 0 1 */3 *'
  workflow_dispatch:
    inputs:
      cube_id:
        description: "CubeCobra cube ID"
        required: false
        default: "d8b9e896-d66d-4cf8-9c59-f752d78d27ac"
        type: string

jobs:
  calculate-price:
    name: Calculate Total Cube Price
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image version
        run: echo "IMAGE_VERSION=$(tr -d '[:space:]' < ./cubecobra-price-checker/image-version.txt)" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate cube total cost
        run: |
          docker run --rm \
            ghcr.io/${{ github.repository_owner }}/cubecobra-price-checker:${IMAGE_VERSION} \
            "${{ inputs.cube_id || 'd8b9e896-d66d-4cf8-9c59-f752d78d27ac' }}" > summary.md

      - name: Output summary
        run: cat summary.md >> "$GITHUB_STEP_SUMMARY"
