name: CubeCobra Cube Price Calculator

on:
  schedule:
    # Run every 3 months
    - cron: '0 0 1 */3 *'
  workflow_dispatch:
    inputs:
      cube_id:
        description: "CubeCobra cube ID"
        required: false
        default: "d8b9e896-d66d-4cf8-9c59-f752d78d27ac"
        type: string

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/cubecobra-price-checker

jobs:
  calculate-price:
    name: Calculate Total Cube Price
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image version
        run: |
          VERSION_FILE="./cubecobra-price-checker/.version"
          if [[ ! -f "$VERSION_FILE" ]]; then
            echo "Missing version file: $VERSION_FILE"
            exit 1
          fi

          IMAGE_VERSION="$(tr -d '[:space:]' < "$VERSION_FILE")"
          if [[ -z "$IMAGE_VERSION" ]]; then
            echo "$VERSION_FILE cannot be empty"
            exit 1
          fi

          if [[ ! "$IMAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$VERSION_FILE must contain a semver version like 1.2.3, but found: '$IMAGE_VERSION'"
            exit 1
          fi

          echo "IMAGE_VERSION=$IMAGE_VERSION" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate cube total cost
        run: |
          docker run --rm \
            "$IMAGE_NAME:$IMAGE_VERSION" \
            "${{ inputs.cube_id || 'd8b9e896-d66d-4cf8-9c59-f752d78d27ac' }}" > summary.md

      - name: Output summary
        run: cat summary.md >> "$GITHUB_STEP_SUMMARY"
