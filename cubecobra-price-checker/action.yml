name: CubeCobra Cube Price Calculator
description: Fetches a CubeCobra cube's mainboard and calculates the total paper cost using Scryfall price data.

inputs:
  cube_id:
    description: "CubeCobra cube ID"
    required: true

runs:
  using: composite
  steps:
    - name: Resolve image version
      id: version
      run: |
        ACTION_DIR="$(cd "${{ github.action_path }}" && pwd)"
        VERSION_FILE="$ACTION_DIR/.version"
        if [[ ! -f "$VERSION_FILE" ]]; then
          echo "Missing version file: $VERSION_FILE"
          echo "github.action_path=${{ github.action_path }}"
          echo "Resolved action directory: $ACTION_DIR"
          echo "Current working directory: $(pwd)"
          ls -la "$ACTION_DIR"
          exit 1
        fi
        IMAGE_VERSION="$(tr -d '[:space:]' < "$VERSION_FILE")"
        if [[ -z "$IMAGE_VERSION" ]]; then
          echo "$VERSION_FILE cannot be empty"
          exit 1
        fi
        if [[ ! "$IMAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "$VERSION_FILE must contain a semver version like 1.2.3, but found: '$IMAGE_VERSION'"
          exit 1
        fi
        echo "version=$IMAGE_VERSION" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Run CubeCobra price checker
      run: |
        docker run --rm \
          ghcr.io/${{ github.repository_owner }}/cubecobra-price-checker:${{ steps.version.outputs.version }} \
          "${{ inputs.cube_id }}" > summary.md
      shell: bash

    - name: Output summary
      run: cat summary.md >> "$GITHUB_STEP_SUMMARY"
      shell: bash
